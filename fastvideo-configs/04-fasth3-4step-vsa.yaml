# FastVideo 推理配置模板（FastH3 4-step VSA —— 视频+音频同步生成）
# 原样取自仓库 examples/inference/basic/basic_fasth3_spark.yaml（单 Spark 版），
# 仅把 num_gpus/offload 注释补全，可直接在单卡 CUDA 上试。
#
# 运行（按设备选一组环境变量）：
#   # NVIDIA 数据中心卡（sm90+/sm100）
#   FASTVIDEO_ATTENTION_BACKEND=VIDEO_SPARSE_ATTN_H3 \
#     fastvideo generate --config 04-fasth3-4step-vsa.yaml
#
#   # DGX Spark / GB10（无 FA4、无 sm_100a VSA 内核，两者必须关）
#   FASTVIDEO_VSA_SM100A=0 FASTVIDEO_FA4=0 FASTVIDEO_ATTENTION_BACKEND=VIDEO_SPARSE_ATTN_H3 \
#     FASTVIDEO_STAGE_LOGGING=1 \
#     fastvideo generate --config 04-fasth3-4step-vsa.yaml

generator:
  model_path: FastVideo/FastVideo-FastH3-4-step-Preview-v1-VSA-DataFree
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: true
      vae: true
      pin_cpu_memory: true
      lazy_module_load: true     # 统一内存设备上自动等价生效；离散卡显式开可省峰值显存
    compile:
      enabled: false             # DiT 不编译
      vae_enabled: true          # 只编译 VAE
  pipeline:
    experimental:
      attention_backend: VIDEO_SPARSE_ATTN_H3   # 角色级请求，会覆盖环境变量
      VSA_sparsity: 0.9          # 4-step Preview 训练值就是 0.9
      VSA_tile_size: 64
      inference_torch_compile: true             # 区域 fullgraph 编译（会改数值，见说明第 13.2 节）
      vae_parallel_decode: true
      vae_parallel_decode_strategy: gather

request:
  prompt: >-
    A wide cinematic shot of an alpine meadow at sunrise, pale pink mountain
    peaks above a blue valley filled with thin morning mist.
  negative_prompt: ""
  sampling:
    seed: 2026
    height: 768
    width: 1344
    num_frames: 124                              # 合法值必须是 17n+5，上限 345
    fps: 24
    num_inference_steps: 5                       # 网格点数：5 点 = 4 次 DiT 前向
    guidance_scale: 1.0                          # 蒸馏模型要 1.0（关 CFG）
    batch_cfg: false
  output:
    output_path: outputs/fasth3/
    save_video: true
    return_frames: false

# 重要约束（H3 专属）：
#   1. num_frames 必须满足 17n+5，最大 345（15.08 秒）；单台 Spark 上 345 可能 OOM
#   2. num_inference_steps 是「sigma 网格点数」，不是去噪步数
#   3. 不要给 H3 设通用 flow_shift —— H3 用 checkpoint 自带的 video/audio 双 shift
#   4. 换成 8-Step V2 时，阶梯是训练死的（9 个点 = 8 次前向），脚本会拒绝其他值
