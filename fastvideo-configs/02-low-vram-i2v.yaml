# FastVideo 推理配置模板（单卡 OOM 救命 / 省显存）
# 按需逐级打开卸载；顺序见注释，别一次全开（会慢很多）
#   fastvideo generate --config 02-low-vram-i2v.yaml

generator:
  model_path: Wan-AI/Wan2.1-I2V-14B-480P-Diffusers
  engine:
    num_gpus: 1
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: true                # 4) 最后手段：DiT 权重放 CPU
      dit_layerwise: true      # 1) 单卡「推荐」常开：逐层卸载 + 与计算重叠，开销可忽略
      vae: true                # 2) OOM 首选：VAE 按需搬运
      image_encoder: true      # 3) 还 OOM 时开
      text_encoder: false      # 5) 最慢，最后才考虑
      pin_cpu_memory: true
      # lazy_module_load: true # 6) 只在「加载阶段就挂」时才用，见模板 05
    compile:
      enabled: false
  pipeline:
    workload_type: i2v
    vae_tiling: true           # 分块 VAE 解码，再降一档显存峰值

request:
  prompt: >-
    An astronaut hatching from an egg, on the surface of the moon, the
    darkness and depth of space realised in the background. High quality,
    ultrarealistic detail and breath-taking movie-like camera shot.
  inputs:
    image_path: https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/astronaut.jpg
  sampling:
    seed: 1024
    num_frames: 77
    height: 480
    width: 832
    fps: 16
    num_inference_steps: 40
    guidance_scale: 5.0
  output:
    output_path: outputs/i2v/
    save_video: true
